services:
  mysql:
    image: mysql:8
    container_name: estore-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: estore
      MYSQL_USER: estore
      MYSQL_PASSWORD: estorepassword
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./estore-backend
    container_name: estore-backend
    ports:
      - "8080:8080"
    environment:
      # Spring datasource (backend application.yml reads these)
      DB_URL: jdbc:mysql://mysql:3306/estore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: estore
      DB_PASSWORD: estorepassword
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect


      # JWT
      JWT_SECRET: dev_jwt_secret_ChangeMeToSomethingLongEnough_AndRandom
      JWT_EXPIRATION: 86400000
    depends_on:
      - mysql

  frontend:
    build:
      context: ./estore-frontend
    container_name: estore-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend

volumes:
  mysql_data:
